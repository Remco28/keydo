<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keydo — redesign mockup</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="stylesheet" href="mockup.css">
  <script>
    // Set the theme before first paint so the page never flashes the wrong one.
    (function () {
      var t = null;
      try { t = localStorage.getItem("keydo.mockup.theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5 9.5 17 19 7.5"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
      <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4.5h12l-2.5 4 2.5 4H5"/></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="3"/><circle cx="9" cy="10" r="1.5"/><path d="m4.5 17 5-4.5 3.5 3 2.5-2 4 3.5"/></symbol>
      <symbol id="i-tree" viewBox="0 0 24 24"><path d="M5 4v11a3 3 0 0 0 3 3h3M5 9a3 3 0 0 0 3 3h3M15 12h5M15 18h5"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></symbol>
      <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4H4zM15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4H4zM16 9.5l5 5M21 9.5l-5 5"/></symbol>
      <symbol id="i-ext" viewBox="0 0 24 24"><path d="M9 6h9v9M18 6 7 17"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 5v14m0 0-3-3m3 3 3-3M17 19V5m0 0-3 3m3-3 3 3"/></symbol>
    </defs>
  </svg>

  <div class="app" id="app" data-focus="list">
    <aside class="side" aria-label="Views and projects">
      <div class="brand" role="img" aria-label="Keydo"><i class="mark"></i><i class="word"></i></div>
      <button class="new-btn" id="new-btn" type="button" tabindex="-1"><span>New task</span><kbd class="key" data-k="N">N</kbd></button>
      <label class="search"><svg class="i"><use href="#i-search"/></svg><input id="search" placeholder="Search all tasks" autocomplete="off" spellcheck="false"><kbd class="key" data-k="/">/</kbd></label>
      <div class="nav-scroll">
        <nav class="nav" id="nav-views" aria-label="Views"></nav>
        <div class="nav">
          <div class="side-label"><span>Projects</span><span>Go to <kbd class="key" data-k="G">G</kbd></span></div>
          <div class="nav" id="nav-projects"></div>
        </div>
      </div>
      <div class="side-foot">
        <div class="sync"><span class="dot"></span><span>Demo data · not connected</span></div>
        <div class="foot-row">
          <button class="ghost-btn grow" id="help-btn" type="button" tabindex="-1"><span>Keyboard map</span><kbd class="key" data-k="?">?</kbd></button>
          <button class="ghost-btn" id="theme-btn" type="button" tabindex="-1" title="Switch theme" aria-label="Switch theme"></button>
          <button class="ghost-btn" id="sound-btn" type="button" tabindex="-1" title="Sound" aria-label="Sound"></button>
        </div>
      </div>
    </aside>

    <main class="list" aria-label="Task list">
      <header class="lh">
        <div class="lh-main">
          <div class="eyebrow" id="eyebrow"></div>
          <h1 id="view-title"></h1>
          <div class="lh-sum" id="view-sum"></div>
        </div>
        <div class="lh-tools">
          <div class="ring" id="ring" title="Tasks done today"></div>
          <button class="btn" id="sort-btn" type="button" tabindex="-1"><svg class="i"><use href="#i-sort"/></svg><span id="sort-label">Sort</span><kbd class="key" data-k="B">B</kbd></button>
        </div>
      </header>
      <div class="ls" id="ls" role="list"><div class="cursor" id="cursor"></div></div>
    </main>

    <section class="dp" id="dp" aria-label="Task details"></section>

    <footer class="kb" id="kb" aria-label="Keys for this context"></footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="overlay"></div>
  <div id="fx" aria-hidden="true"></div>
  <script src="mockup.js"></script>
</body>
</html>
